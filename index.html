<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رَمْي 🏹</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif; 
      background: linear-gradient(180deg, #10251b, #07110c);
      color: white; 
      text-align: center;
      min-height: 100vh;
    }

    header {
      padding: 25px 15px 10px;
    }

    h1 {
      font-size: 42px;
      margin: 0 0 8px;
    }

    p {
      color: #cbd8cf;
      font-size: 18px;
    }

    .game {
      width: 92%;
      max-width: 500px;
      margin: 20px auto;
      background: #183326;
      border-radius: 25px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }

    .score {
      font-size: 25px;
      margin-bottom: 15px;
    }

    .target {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      margin: 20px auto;
      background:
        radial-gradient(circle,
          #111 0 12%,
          white 12% 25%,
          #d33 25% 38%,
          white 38% 52%,
          #3578d4 52% 68%,
          white 68% 82%,
          #222 82% 100%);
      border: 8px solid #b88a4a;
      box-shadow: 0 8px 20px rgba(0,0,0,.4);
      cursor: pointer;
      transition: transform .15s;
    }

    .target:active {
      transform: scale(.96);
    }

    button {
      width: 90%;
      max-width: 350px;
      padding: 17px;
      border: none;
      border-radius: 15px;
      background: #d99a35;
      color: #111;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(.97);
    }

    #message {
      min-height: 30px;
      font-size: 20px;
      margin: 15px; 
    }
  </style>
</head>

<body>

  <header>
    <h1>رَمْي 🏹</h1>
    <p>اختبر دقة تصويبك!</p>
  </header>

  <div class="game">

    <div class="score">
      النقاط: <span id="score">0</span>
    </div>

    <div class="target" onclick="shoot()"></div>

    <div id="message">
      اضغط على الهدف للرمي 🏹
    </div>

    <button onclick="startGame()">
      🎯 ابدأ لعبة جديدة
    </button>

  </div>

  <script>
    let score = 0;

    function shoot() {
      const points = Math.floor(Math.random() * 10) + 1;
      score += points;

      document.getElementById("score").textContent = score;

      if (points >= 8) {
        document.getElementById("message").textContent =
          "🔥 إصابة ممتازة! +" + points;
      } else if (points >= 5) {
        document.getElementById("message").textContent =
          "👏 إصابة جيدة! +" + points;
      } else {
        document.getElementById("message").textContent =
          "🏹 حاول تصيب المركز! +" + points;
      }
    }

    function startGame() {
      score = 0;
      document.getElementById("score").textContent = score;
      document.getElementById("message").textContent =
        "🎯 ابدأ التصويب!";
    } 
  </script>

</body>
</html>
